spring.application.name=causal-broadcast-java

# Directory where the persistent state snapshot (state.json) is stored.
causal.broadcast.data-dir=./data
# Whether a broadcast is automatically fanned out to all active participants.
# Disable it to drive message arrival explicitly through the receive endpoint.
causal.broadcast.auto-fanout=true
# Number of delivered messages kept behind the read cursor per participant
# (0 = trim delivered entries as soon as the cursor passes them).
causal.broadcast.delivered-retention=0
